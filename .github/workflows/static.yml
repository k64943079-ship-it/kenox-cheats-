<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Am I</title>
    <style>
        /* Reset and base styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2b2b36; /* Dark theme background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        /* Main Card Container */
        .whoami-card {
            background-color: #2c2f33; /* Slightly lighter than body for the card */
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
            max-width: 380px;
            /* Optional: subtle shadow for depth */
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Left Profile Section */
        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
        }

        .avatar-wrapper {
            position: relative;
            margin-bottom: 8px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #2c2f33; /* Border to separate from status */
            background-color: #1e1e1e;
        }

        /* Green Online Status Dot */
        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background-color: #3ba55c;
            border-radius: 50%;
            border: 2px solid #2c2f33;
        }

        .username {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .badge-icon {
            width: 14px;
            height: 14px;
            background-color: #4e5058;
            border-radius: 3px;
            display: inline-block;
            position: relative;
        }
        /* Simple SVG for the badge */
        .badge-icon svg {
            width: 100%;
            height: 100%;
            fill: white;
        }

        .user-tag {
            font-size: 12px;
            color: #b5bac1;
            margin-top: -2px;
        }

        /* Right Chat Bubble Section */
        .chat-section {
            padding-top: 4px; /* Align slightly with top of avatar */
        }

        .chat-bubble {
            background-color: #35373c;
            padding: 8px 14px;
            border-radius: 8px 12px 12px 8px; /* Rounded bubble shape */
            font-size: 15px;
            color: #dbdee1;
            position: relative;
            max-width: 200px;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* The little triangle tail on the bubble */
        .chat-bubble::before {
            content: "";
            position: absolute;
            left: -6px;
            top: 10px;
            border-width: 6px 6px 6px 0;
            border-style: solid;
            border-color: transparent #35373c transparent transparent;
        }

        /* Fake background blur on top (mimicking the screenshot) */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, #2b2d42, transparent);
            z-index: -1;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <!-- Background effect (Optional to match the image's top gradient) -->
    <div class="bg-overlay"></div>

    <div class="whoami-card">
        <!-- Left side: Profile Info -->
        <div class="profile-section">
            <div class="avatar-wrapper">
                <!-- Replace 'avatar.jpg' with your actual image path or URL -->
                <img src="https://i.pravatar.cc/150?img=11" alt="Varun" class="avatar">
                <div class="status-dot"></div>
            </div>
            <div class="username">
                Varun
                <span class="badge-icon">
                    <!-- Simple server/boost badge icon -->
                    <svg viewBox="0 0 24 24"><path d="M21 16.5C21 16.88 20.79 17.21 20.47 17.38L12.57 21.82C12.41 21.94 12.21 22 12 22C11.79 22 11.59 21.94 11.43 21.82L3.53 17.38C3.21 17.21 3 16.88 3 16.5V7.5C3 7.12 3.21 6.79 3.53 6.62L11.43 2.18C11.59 2.06 11.79 2 12 2C12.21 2 12.41 2.06 12.57 2.18L20.47 6.62C20.79 6.79 21 7.12 21 7.5V16.5Z"/></svg>
                </span>
            </div>
            <div class="user-tag">vxrunhh</div>
        </div>

        <!-- Right side: Chat Bubble -->
        <div class="chat-section">
            <div class="chat-bubble" id="messageBubble">
                <!-- Message will be inserted here by JS -->
            </div>
        </div>
    </div>

    <script>
        // JavaScript to automatically insert the "Heeeee...." message
        document.addEventListener('DOMContentLoaded', () => {
            const messageBubble = document.getElementById('messageBubble');
            // You can change this text to whatever you want your "whoami" to be
            messageBubble.textContent = 'Heeeee....';
        });
    </script>

</body>
</html>
